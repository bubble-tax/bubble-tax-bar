name: Validate
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Collector tests
        run: python3 -m unittest discover -s Tests -v
      - name: Native tests and build
        # Release packaging needs the developer's Python framework and signing Keychain.
        # CI validates the collectors, native tests and release executable.
        run: |
          swift test
          swift build -c release
